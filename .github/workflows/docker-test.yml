name: Test Dockerfile

on:
  pull_request:
    branches:
      - '*'

jobs:
  test-dockerfile:
    name: Test Dockerfile Build and Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t iac-ci:test .

      - name: Test basic commands
        run: |
          docker run --rm iac-ci:test "echo 'Image runs successfully'"
          docker run --rm iac-ci:test "bash --version"
          docker run --rm iac-ci:test "git --version"
          docker run --rm iac-ci:test "curl --version"
          docker run --rm iac-ci:test "python3 --version"
          docker run --rm iac-ci:test "pip --version"
          docker run --rm iac-ci:test "jq --version"
          docker run --rm iac-ci:test "make --version"
          docker run --rm iac-ci:test "aws --version"
          docker run --rm iac-ci:test "kubectl version --client"
          docker run --rm iac-ci:test "helm version"
          docker run --rm iac-ci:test "helm plugin list | awk 'NR>1 {print \$1}' | grep -qx diff || { echo 'ERROR: helm-diff plugin not installed'; helm plugin list; exit 1; }"
          docker run --rm iac-ci:test "tfenv --version"
          docker run --rm iac-ci:test "command -v terraform"
          docker run --rm iac-ci:test "terragrunt --version"
          docker run --rm iac-ci:test "vault version"
          docker run --rm iac-ci:test "opa version"
          docker run --rm iac-ci:test "conftest --version"
          docker run --rm iac-ci:test "yq --version"
          docker run --rm iac-ci:test "kustomize version"
          docker run --rm iac-ci:test "flux --version"
          docker run --rm iac-ci:test "psql --version"
          docker run --rm iac-ci:test "mysql --version"
          echo "✅ All basic command tests passed!"

      - name: Test distrusted CA roots are absent
        run: |
          # Any eMudhra (emSign PKI) root, incl. emSign ECC Root CA - G3 (eMudhra incident, Mozilla bug 2083449)
          docker run --rm iac-ci:test "python3 -c '
          import glob, hashlib, os, re, ssl, sys
          distrusted = {\"86A1ECBA089C4A8D3BBE2734C612BA341D813E043CF9E8A862CD5C57A36BBE6B\"}
          bundles = [\"/etc/ssl/certs/ca-certificates.crt\"] + [p for p in glob.glob(\"/usr/lib/python3*/site-packages/**/cacert.pem\", recursive=True) if not os.path.islink(p)]
          found = set()
          for b in bundles:
              for p in re.findall(r\"-----BEGIN CERTIFICATE-----.+?-----END CERTIFICATE-----\", open(b).read(), re.S):
                  der = ssl.PEM_cert_to_DER_cert(p)
                  if b\"emudhra\" in der.lower() or hashlib.sha256(der).hexdigest().upper() in distrusted:
                      found.add(\"%s:%s\" % (b, hashlib.sha256(der).hexdigest()[:16]))
          sys.exit(\"ERROR: eMudhra roots in CA bundles: %s\" % sorted(found) if found else 0)
          '"
          docker run --rm iac-ci:test "test \"\$(readlink -f \"\$(python3 -c 'from pip._vendor import certifi; print(certifi.where())')\")\" = /etc/ssl/certs/ca-certificates.crt || { echo 'ERROR: pip is not using the system CA bundle'; exit 1; }"
          docker run --rm iac-ci:test "for f in \$(find /usr/lib/python3*/site-packages -name cacert.pem); do test \"\$(readlink -f \$f)\" = /etc/ssl/certs/ca-certificates.crt || { echo \"ERROR: \$f is not the system CA bundle\"; exit 1; }; done"
          echo "✅ No eMudhra CA roots in CA bundles!"
